server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=payment_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: REPLACE_WITH_ENV_VARIABLE
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.enterprise.payment: DEBUG
    org.springframework.web: INFO
