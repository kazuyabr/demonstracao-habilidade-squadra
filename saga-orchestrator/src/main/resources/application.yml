server:
  port: 8086

spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=saga_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${SAGA_DB_PASSWORD:REPLACE_WITH_ENV_VARIABLE}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Internal service endpoints called by the orchestrator.
# In Docker these resolve to container names (see application-docker.yml);
# here they target local development instances.
saga:
  services:
    order-service: ${ORDER_SERVICE_URL:http://localhost:8081}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:8082}
    inventory-service: ${INVENTORY_SERVICE_URL:http://localhost:8083}

pulsar:
  service-url: pulsar://localhost:6650

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.enterprise.saga: DEBUG
    com.enterprise.events: DEBUG
