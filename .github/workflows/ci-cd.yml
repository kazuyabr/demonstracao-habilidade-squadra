name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./target/site/jacoco/index.html
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-apps
          path: |
            order-service/target/*.jar
            payment-service/target/*.jar
            inventory-service/target/*.jar
            notification-service/target/*.jar
            legacy-integration-service/target/*.jar
            saga-orchestrator/target/*.jar
            api-gateway/target/*.jar

  docker:
    name: Build Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - payment-service
          - inventory-service
          - notification-service
          - legacy-integration-service
          - saga-orchestrator
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    name: Deploy to Dev
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    env:
      KUBECONFIG_DEV: ${{ secrets.KUBECONFIG_DEV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Kubernetes (Dev)
        if: env.KUBECONFIG_DEV != ''
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_DEV }}
        run: kubectl apply -k k8s/overlays/dev

      - name: Dev deployment skipped (no credentials)
        if: env.KUBECONFIG_DEV == ''
        run: |
          echo "No KUBECONFIG_DEV secret configured - skipping actual deployment."
          echo "To enable, add a KUBECONFIG_DEV repository secret containing your kubeconfig."

  deploy-prod:
    name: Deploy to Production
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Kubernetes (Production)
        if: env.KUBECONFIG_PROD != ''
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PROD }}
        run: kubectl apply -k k8s/overlays/prod

      - name: Production deployment skipped (no credentials)
        if: env.KUBECONFIG_PROD == ''
        run: |
          echo "No KUBECONFIG_PROD secret configured - skipping actual deployment."
          echo "To enable, add a KUBECONFIG_PROD repository secret containing your kubeconfig."
