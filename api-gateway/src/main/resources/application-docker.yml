spring:
  config:
    activate:
      on-profile: docker

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://order-service:8081
          predicates:
            - Path=/api/orders/**,/api/orders
          filters:
            - RewritePath=/api/orders(?<segment>.*), /api/v1/orders$\{segment}
        - id: payment-service
          uri: http://payment-service:8082
          predicates:
            - Path=/api/payments/**,/api/payments
          filters:
            - RewritePath=/api/payments(?<segment>.*), /api/v1/payments$\{segment}
        - id: inventory-service
          uri: http://inventory-service:8083
          predicates:
            - Path=/api/inventory/**,/api/inventory
          filters:
            - RewritePath=/api/inventory(?<segment>.*), /api/v1/inventory$\{segment}
        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/api/notifications/**
        - id: legacy-service
          uri: http://legacy-integration-service:8085
          predicates:
            - Path=/api/legacy/**
        - id: saga-orchestrator
          uri: http://saga-orchestrator:8086
          predicates:
            - Path=/api/sagas/**

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/enterprise-platform/protocol/openid-connect/certs
